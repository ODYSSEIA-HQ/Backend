# ΟΔΥΣΣΕΙΑ 单机全栈编排（64G 宿主机）
# 组件：Caddy / NodeBB(+自研插件) / Centrifugo / Meilisearch / MongoDB / Redis / BFF
# 启动前：cp .env.example .env 并填好全部密钥
# 启动：docker compose up -d --build

name: odysseia

services:
  # ---------- 反向代理 ----------
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      ODYSSEIA_DOMAIN: ${ODYSSEIA_DOMAIN}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      nodebb:
        condition: service_healthy
      bff:
        condition: service_healthy
      centrifugo:
        condition: service_started

  # ---------- 论坛主体（NodeBB v4 + 两个自研插件） ----------
  nodebb:
    build:
      context: .
      dockerfile: nodebb/Dockerfile
    restart: unless-stopped
    environment:
      # ---- 无头首装（实证：nodebb/upstream/NodeBB/src/install.js envConfMap）----
      # 仅当 SETUP 非空时，entrypoint 执行 nodebb setup（强制重新安装场景）；
      # 日常启动 SETUP 留空，config.json 缺失时 entrypoint 也会自动跑 nodebb install，
      # 由下方 NODEBB_* 环境变量（install.js envConfMap）完成全自动首装
      SETUP: ${NODEBB_SETUP:-}
      NODEBB_URL: https://${ODYSSEIA_DOMAIN}
      NODEBB_ADMIN_USERNAME: ${NODEBB_ADMIN_USERNAME:-admin}
      NODEBB_ADMIN_PASSWORD: ${NODEBB_ADMIN_PASSWORD:?请在 .env 设置 NODEBB_ADMIN_PASSWORD}
      NODEBB_ADMIN_EMAIL: ${NODEBB_ADMIN_EMAIL:?请在 .env 设置 NODEBB_ADMIN_EMAIL}
      NODEBB_DB: mongo
      NODEBB_DB_HOST: mongo
      NODEBB_DB_PORT: "27017"
      NODEBB_DB_USER: ${MONGO_INITDB_ROOT_USERNAME}
      NODEBB_DB_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      NODEBB_DB_NAME: ${MONGO_INITDB_DATABASE}
      # secret 无需环境变量：setup 自动生成并写入 config.json
      # ---- 桥接插件读取 ----
      CENTRIFUGO_API_URL: http://centrifugo:8000/api
      CENTRIFUGO_HTTP_API_KEY: ${CENTRIFUGO_HTTP_API_KEY}
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      # 制度插件读取（内部通信 token）
      ODYSSEIA_INTERNAL_TOKEN: ${ODYSSEIA_INTERNAL_TOKEN}
    volumes:
      # 官方镜像 VOLUME 声明：本体在 /usr/src/app/（不含 nodebb/ 子目录）
      - nodebb_uploads:/usr/src/app/public/uploads
      # config.json / install_hash / 运行时 package.json 所在（entrypoint CONFIG_DIR）
      - nodebb_config:/opt/config
    mem_limit: 8g
    healthcheck:
      # HTTP 起不来即 unhealthy（覆盖 NodeBB 内部崩坏；mongo/redis 故障由 depends_on 前置挡）
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4567/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started

  # ---------- 实时网关 ----------
  centrifugo:
    image: centrifugo/centrifugo:v6
    restart: unless-stopped
    command: centrifugo -c /etc/centrifugo/config.json
    # admin 面板不再走公网（Caddyfile 已撤 /centrifugo/* 路由）：
    # 需要 UI 时从宿主机 ssh 端口转发访问 http://127.0.0.1:4000/centrifugo/admin/
    ports:
      - "127.0.0.1:4000:8000"
    mem_limit: 4g
    environment:
      # 环境变量覆盖 config.json 中对应字段：CENTRIFUGO_ + 大写路径（. → _）
      # client.token.hmac_secret_key / http_api.key / admin.password / admin.secret
      # （admin.enabled 与 handler_prefix 已写在 config.json；secret 用于签发 admin token，
      #   v6 要求 password 与 secret 同时设置，否则 /admin/auth 直接 400）
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY}
      CENTRIFUGO_HTTP_API_KEY: ${CENTRIFUGO_HTTP_API_KEY}
      CENTRIFUGO_ADMIN_PASSWORD: ${CENTRIFUGO_ADMIN_PASSWORD}
      CENTRIFUGO_ADMIN_SECRET: ${CENTRIFUGO_ADMIN_SECRET}
      # 订阅代理共享密钥：v6.3+ 以 ${CENTRIFUGO_VAR_*} 插值进 config.json proxies.http.static_headers，
      # Centrifugo 调 BFF 订阅回调时携带 x-odysseia-proxy 头，BFF 校验后放行（防伪造调用）
      CENTRIFUGO_VAR_PROXY_SECRET: ${ODYSSEIA_PROXY_SECRET:?请在 .env 设置 ODYSSEIA_PROXY_SECRET}
    volumes:
      - ./centrifugo/config.json:/etc/centrifugo/config.json:ro
    ulimits:
      # fd 上限=内核单进程默认天花板（fs.nr_open=1048576），每个 WS 连接占 1 fd；
      # 上限本身不预留资源，实际内存由连接数决定（~10KB/连接）
      nofile:
        soft: 1048576
        hard: 1048576
    depends_on:
      - bff # subscribe proxy 指向 BFF

  # ---------- 全文搜索 ----------
  meilisearch:
    image: getmeili/meilisearch:v1.12
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
      MEILI_MAX_INDEXING_MEMORY: "4Gb"
      MEILI_HTTP_PAYLOAD_SIZE_LIMIT: "104857600"
    volumes:
      - meili_data:/meili_data
    mem_limit: 12g

  # ---------- 数据库 ----------
  mongo:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    command: ["--wiredTigerCacheSizeGB", "12"]
    healthcheck:
      # 防止 nodebb setup 在 mongo 首次初始化 root 用户完成前抢跑
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - mongo_data:/data/db
      - ./scripts:/scripts:ro # 备份脚本用
    mem_limit: 16g # 12G wiredTiger cache + 连接/聚合开销余量，防止慢查询吃光 64G

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # noeviction：NodeBB 的 Redis 键多为无 TTL 业务数据（会话/通知/计数），
    # LRU 驱逐会造成静默数据丢失（帖子数丢失、通知丢失类诡异 bug），宁可写满时报错
    command: ["redis-server", "--maxmemory", "2gb", "--maxmemory-policy", "noeviction", "--requirepass", "${REDIS_PASSWORD}"]
    mem_limit: 3g # maxmemory 2gb + fork 持久化时 COW 开销余量
    volumes:
      - redis_data:/data

  # ---------- BFF 聚合层 ----------
  bff:
    build:
      context: ./bff
    restart: unless-stopped
    environment:
      NODEBB_URL: http://nodebb:4567
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY}
      ODYSSEIA_INTERNAL_TOKEN: ${ODYSSEIA_INTERNAL_TOKEN}
      ODYSSEIA_PROXY_SECRET: ${ODYSSEIA_PROXY_SECRET}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_MEDIA: ${R2_BUCKET_MEDIA}
      R2_BUCKET_R18: ${R2_BUCKET_R18}
    depends_on:
      nodebb:
        condition: service_healthy
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "/usr/local/bin/odysseia-bff", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ---------- 可观测性（全内网，不对公网暴露） ----------
  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    mem_limit: 2g

  grafana:
    image: grafana/grafana:11.5.2
    restart: unless-stopped
    # 与 Centrifugo admin 同策略：宿主机回环 + ssh 端口转发访问
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      # 匿名只读访客模式（真要多人用时再接 NodeBB OAuth）
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?请在 .env 设置 GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    mem_limit: 1g
    depends_on:
      - prometheus

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.51.0
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    mem_limit: 1g

  mongo-exporter:
    # mongodb_exporter（percona 维护分支）：连 primary 读 db.serverStatus 等
    image: percona/mongodb_exporter:0.42
    restart: unless-stopped
    command:
      - --mongodb.uri=mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/admin
    mem_limit: 512m
    depends_on:
      mongo:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    mem_limit: 256m

volumes:
  caddy_data:
  caddy_config:
  nodebb_uploads:
  nodebb_config:
  mongo_data:
  redis_data:
  meili_data:
  prometheus_data:
  grafana_data:
